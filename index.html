<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#185FA5">
<title>Sri Kalam Tuition — Student App</title>
<link rel="manifest" href="student-manifest.json">
<style>
:root{--pr:#185FA5;--pr2:#2f80d1;--bg:#eef4fb;--card:#fff;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8;--br:#dbe5f1;--ok:#16a34a;--bad:#dc2626;--warn:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#e8eefb;--tx2:#a8b5cc;--tx3:#6b7a94;--br:#223049}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Poppins','Noto Sans Tamil',system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding-bottom:78px}
.hide{display:none!important}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#185FA5,#2f80d1 55%,#7c3aed)}
.lbox{background:var(--card);border-radius:22px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .4s ease}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.logo{width:64px;height:64px;border-radius:18px;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 12px}
h1{font-size:18px;text-align:center}.sub{font-size:12px;color:var(--tx2);text-align:center;margin:4px 0 18px}
label{font-size:11px;font-weight:600;color:var(--tx2);display:block;margin:10px 0 4px}
input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--br);background:var(--bg);color:var(--tx);font-size:15px;font-family:inherit;outline:none}
input:focus{border-color:var(--pr)}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--pr);color:#fff;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:16px}
.btn:active{transform:scale(.98)}.btn.s{width:auto;padding:8px 14px;font-size:12px;margin:0;border-radius:10px}
.err{color:var(--bad);font-size:12px;text-align:center;margin-top:10px;min-height:16px}
.demo{background:#fef3c7;color:#92400e;font-size:11px;padding:7px 10px;border-radius:10px;margin-top:14px;text-align:center}
header{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;padding:16px 16px 22px;border-radius:0 0 22px 22px}
.hrow{display:flex;justify-content:space-between;align-items:center}
.hn{font-size:17px;font-weight:700}.hs{font-size:11px;opacity:.85}
.out{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:10px;padding:6px 10px;font-size:11px;cursor:pointer}
main{padding:14px;max-width:640px;margin:-12px auto 0}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;padding:14px;margin-bottom:12px;animation:up .35s ease both}
.ct{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.ct span{font-size:10px;color:var(--tx3);font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:24px;font-weight:800}.lab{font-size:11px;color:var(--tx2)}
.ring{width:84px;height:84px;position:relative}.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round;transition:stroke-dasharray 1s ease}
.ring div{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--br)}.row:first-child{border-top:none}
.row .m{flex:1;min-width:0}.row .t{font-size:13px;font-weight:600}.row .d{font-size:11px;color:var(--tx2)}
.chip{font-size:10px;font-weight:700;padding:3px 9px;border-radius:10px}
.paid{background:#dcfce7;color:#166534}.pending,.partial{background:#fef3c7;color:#92400e}.overdue{background:#fee2e2;color:#991b1b}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal b{font-size:10px;color:var(--tx3);text-align:center;font-weight:600}
.cal div{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--bg);color:var(--tx3)}
.cal .P{background:#dcfce7;color:#166534;font-weight:700}.cal .A{background:#fee2e2;color:#991b1b;font-weight:700}.cal .L{background:#fef3c7;color:#92400e;font-weight:700}.cal .H{background:#dbeafe;color:#1e40af;font-weight:700}
.cal .today{outline:2px solid var(--pr)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--tx2);margin-top:10px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:9px;color:var(--tx3)}
.bars i{display:block;width:100%;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--pr2),var(--pr));min-height:3px;transition:height .8s ease}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--br);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
nav button{flex:1;background:none;border:none;color:var(--tx3);font-size:10px;font-family:inherit;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px;transition:transform .2s}nav button.on{color:var(--pr);font-weight:700}nav button.on span{transform:translateY(-2px) scale(1.15)}
.empty{text-align:center;color:var(--tx3);font-size:12px;padding:18px 0}
.msel{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.msel button{background:var(--bg);border:1px solid var(--br);color:var(--tx);border-radius:10px;width:36px;height:34px;font-size:16px;cursor:pointer}
#timer{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#timer .tt{font-size:15px;font-weight:700;margin-bottom:6px}#tleft{font-size:min(22vw,92px);font-weight:800;font-variant-numeric:tabular-nums}
#tleft.warn{color:var(--warn)}#tleft.crit{color:var(--bad)}
.note{font-size:11px;color:var(--tx3);text-align:center;margin-top:10px}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}.tap:active{transform:scale(.98);opacity:.9}
#pop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}#pop>div{background:var(--card);color:var(--tx,inherit);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px 26px;animation:up .25s ease both}
#testov .card,#testov .btn,.noanim .card{animation:none!important;transition:none!important}
</style>
</head>
<body>

<div id="login">
  <div class="lbox">
    <div class="logo">🎓</div>
    <h1>Sri Kalam Tuition</h1>
    <div class="sub">Student Login</div>
    <label>Student ID</label><input id="l-id" autocomplete="username" autocapitalize="characters" placeholder="e.g. ADM-2026-012">
    <label>PIN</label><input id="l-pin" type="password" inputmode="numeric" maxlength="6" autocomplete="current-password" placeholder="6-digit PIN">
    <button class="btn" id="l-btn" onclick="doLogin()">Login</button>
    <div class="err" id="l-err"></div>
    <div class="demo hide" id="l-demo">Demo mode — ID <b>DEMO</b> · PIN <b>123456</b></div>
  </div>
</div>

<div id="app" class="hide">
  <header><div class="hrow"><div><div class="hn" id="h-name">—</div><div class="hs" id="h-sub"></div></div><button class="out" onclick="doLogout()">Logout</button></div></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>

<div id="timer" class="hide">
  <div class="tt" id="t-title"></div><div class="lab">Time left</div><div id="tleft">--:--</div>
  <div class="lab" id="t-end"></div>
  <button class="btn" style="max-width:320px" onclick="finishPaper()">✅ I have finished</button>
  <div class="note">Your start and finish time is shared with your tutor.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" onerror="window.__noFB=1"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js" onerror="window.__noFB=1"></script>
<script>
/* ═══ SETTINGS ═══ paste your Firebase web-app config here (leave null = demo mode) */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyAQS9sm1qoJNppQex4qKjRxMGlF84FTdXw",
  authDomain: "kalam-tuition-center-test.firebaseapp.com",
  projectId: "kalam-tuition-center-test",
  storageBucket: "kalam-tuition-center-test.firebasestorage.app",
  messagingSenderId: "107379425998",
  appId: "1:107379425998:web:38c9a3783d7c1deff0069f"
};
var CENTER = { name:'Sri Kalam Tuition', city:'Chidambaram' };
var EMAIL_DOMAIN = '@kalam-student.app';

var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var san=function(id){return String(id||'').trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')};
var DEMO=!FIREBASE_CONFIG||window.__noFB, db=null, auth=null, ME=null, CEN={notices:[],papers:[],tests:[]}, tab='home', calY=0, calM=0;

/* ── demo data ── */
function demoData(){
  var att={},d=new Date(),i,s=['P','P','P','A','P','P','L','P','P','P','H','P','P','A'];
  for(i=0;i<60;i++){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-i);if(x.getDay()===0)continue;att[iso(x)]=s[i%s.length]}
  return {me:{id:'DEMO',name:'Arun Kumar',grade:'10',batch:'Maths – Morning',parent:'Ravi Kumar',att:att,
    fees:[{month:'Nov 2026',total:1000,paid:500,balance:500,status:'partial'},{month:'Oct 2026',total:1000,paid:1000,balance:0,status:'paid'},{month:'Sep 2026',total:1000,paid:1000,balance:0,status:'paid'}],
    marks:[{exam:'Unit Test 1',subject:'Maths',date:'2026-09-10',marks:42,max:50},{exam:'Monthly Test',subject:'Science',date:'2026-10-05',marks:38,max:50},{exam:'Unit Test 2',subject:'Maths',date:'2026-10-28',marks:45,max:50},{exam:'Quarterly',subject:'English',date:'2026-11-12',marks:71,max:100}]},
   cen:{notices:[{id:'n1',date:'2026-11-20',title:'Quarterly exam timetable',text:'Quarterly exams start Monday. Please check the timetable on the notice board.'},{id:'n2',date:'2026-11-18',title:'Holiday',text:'Tuition will be closed on Friday.'}],
        tests:[{id:'t1',title:'Maths MCQ 1',subject:'Maths',grade:'10',duration:10,published:true,qs:[{q:'2 + 2 = ?',o:['3','4','5','6'],m:1},{q:'Square root of 81?',o:['7','8','9','10'],m:1}]}],
        papers:[{id:'p1',title:'Maths Model Paper 1',subject:'Maths',grade:'10',duration:90,link:'',date:'2026-11-19'},{id:'p2',title:'Science Quick Test',subject:'Science',grade:'10',duration:30,link:'',date:'2026-11-17'}]}};
}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

/* ── activity log ── */
function logAct(type,extra){
  var rec=Object.assign({sid:ME?san(ME.id):'',name:ME?ME.name:'',type:type,ts:Date.now()},extra||{});
  try{
    if(DEMO){var a=JSON.parse(localStorage.getItem('kt_act')||'[]');a.push(rec);localStorage.setItem('kt_act',JSON.stringify(a.slice(-100)));return}
    db.collection('activity').add(rec).catch(function(){});
  }catch(e){}
}

/* ── login ── */
function init(){
  if(DEMO)$('l-demo').classList.remove('hide');
  if(DEMO){var s=localStorage.getItem('kt_demo_in');if(s){enter(demoData())}return}
  firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(function(u){if(u&&!ME)loadFor(u)});
}
async function doLogin(){
  var id=$('l-id').value.trim(),pin=$('l-pin').value.trim(),er=$('l-err');er.textContent='';
  if(!id||pin.length<6){er.textContent='Enter your Student ID and 6-digit PIN';return}
  $('l-btn').textContent='Please wait…';
  try{
    if(DEMO){if(id.toUpperCase()==='DEMO'&&pin==='123456'){localStorage.setItem('kt_demo_in','1');enter(demoData())}else er.textContent='Wrong ID or PIN';return}
    var ok=null;
    for(var v=1;v<=4&&!ok;v++){try{ok=await auth.signInWithEmailAndPassword(san(id)+'-v'+v+EMAIL_DOMAIN,pin)}catch(e){if(e.code==='auth/network-request-failed'){er.textContent='No internet connection';return}}}
    if(!ok){er.textContent='Wrong ID or PIN. Ask your tutor.';return}
  }finally{$('l-btn').textContent='Login'}
}
async function loadFor(u){
  try{
    var did=(u.email||'').replace(/-v\d+@.*$/,'');
    var d=await db.collection('students').doc(did).get();
    if(!d.exists){$('l-err').textContent='Your data is not published yet. Ask your tutor.';await auth.signOut();return}
    var c={notices:[],papers:[],tests:[]};
    try{var n=await db.collection('center').doc('notices').get();if(n.exists)c.notices=n.data().items||[];var p=await db.collection('center').doc('papers').get();if(p.exists)c.papers=p.data().items||[];var ts=await db.collection('center').doc('tests').get();if(ts.exists)c.tests=ts.data().items||[]}catch(e){}
    try{localStorage.setItem('kt_cache',JSON.stringify({me:d.data(),cen:c}))}catch(e){}
    enter({me:d.data(),cen:c},true);
  }catch(e){
    try{var k=JSON.parse(localStorage.getItem('kt_cache')||'null');if(k){enter(k,false,true);return}}catch(e2){}
    $('l-err').textContent='Could not load. Check internet.';
  }
}
function enter(data,fresh,offline){
  ME=data.me;CEN=data.cen||CEN;
  $('login').classList.add('hide');$('app').classList.remove('hide');
  $('h-name').textContent=ME.name;$('h-sub').textContent='Class '+ME.grade+(ME.batch?' · '+ME.batch:'')+(offline?' · offline':'');
  var d=new Date();calY=d.getFullYear();calM=d.getMonth();
  if(fresh!==false&&!offline)logAct('login');
  buildNav();show('home');
  var tr=localStorage.getItem('kt_test');if(tr){try{var o2=JSON.parse(tr);var tt=myTests().filter(function(x){return x.id===o2.t.id})[0];if(tt&&o2.key.indexOf(san(ME.id))===0){TS=o2;TS.t=tt;openTest()}}catch(e){}}
  var t=localStorage.getItem('kt_timer');if(t){try{var o=JSON.parse(t);if(o.end>Date.now()||o.end)startTimer(o,true)}catch(e){}}
}
function doLogout(){ME=null;try{localStorage.removeItem('kt_demo_in')}catch(e){}if(auth)auth.signOut();$('app').classList.add('hide');$('login').classList.remove('hide');$('l-pin').value=''}

/* ── tabs ── */
var TABS=[['home','🏠','Home'],['att','📅','Attendance'],['fees','💰','Fees'],['marks','📝','Marks'],['tests','✅','Tests'],['papers','📄','Papers']];
function buildNav(){$('nav').innerHTML=TABS.map(function(t){return '<button id="nv-'+t[0]+'" onclick="show(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
function show(t){tab=t;TABS.forEach(function(x){$('nv-'+x[0]).classList.toggle('on',x[0]===t)});$('main').innerHTML=({home:vHome,att:vAtt,fees:vFees,marks:vMarks,tests:vTests,papers:vPapers})[t]();window.scrollTo(0,0);setTimeout(anim,40)}
function anim(){document.querySelectorAll('.ring circle[data-l]').forEach(function(c){c.setAttribute('stroke-dasharray',c.dataset.l+' 999')});document.querySelectorAll('.bars i[data-h]').forEach(function(b){b.style.height=b.dataset.h+'%'})}
function ring(p,col){var C=2*Math.PI*36;return '<div class="ring"><svg viewBox="0 0 84 84"><circle cx="42" cy="42" r="36" stroke="var(--br)"/><circle cx="42" cy="42" r="36" stroke="'+col+'" stroke-dasharray="0 999" data-l="'+(Math.max(0,Math.min(100,p))/100*C)+'"/></svg><div>'+Math.round(p)+'%</div></div>'}
function col(p){return p>=85?'var(--ok)':(p>=70?'var(--warn)':'var(--bad)')}

/* ── views ── */
function attStats(days){
  var n=0,p=0,l=0,a=0,t=new Date();
  for(var i=0;i<days;i++){var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-i),v=(ME.att||{})[iso(d)];if(!v||v==='H')continue;n++;if(v==='P')p++;else if(v==='L'){l++;p++}else a++}
  return {n:n,p:p,l:l,a:a,pct:n?p/n*100:null};
}
function vHome(){
  var s=attStats(30),due=(ME.fees||[]).reduce(function(t,f){return t+(f.balance||0)},0),m=(ME.marks||[]).slice().sort(function(a,b){return String(b.date).localeCompare(a.date)})[0];
  var ns=(CEN.notices||[]).filter(function(n){return !n.grade||n.grade===ME.grade}).slice(0,3);
  window.__ns=ns;return '<div class="card tap" onclick="show(\'att\')"><div class="ct">Last 30 days attendance<span>'+(s.n?s.p+' of '+s.n+' days':'')+'</span></div>'+(s.pct===null?'<div class="empty">No attendance yet</div>':'<div style="display:flex;gap:16px;align-items:center">'+ring(s.pct,col(s.pct))+'<div><div class="lab">Present '+s.p+' · Absent '+s.a+'</div><div class="lab">Late '+s.l+'</div></div></div>')+'</div>'
   +'<div class="grid2"><div class="card tap" onclick="show(\'fees\')"><div class="lab">Fees pending</div><div class="big" style="color:'+(due?'var(--bad)':'var(--ok)')+'">₹'+due.toLocaleString('en-IN')+'</div><div class="lab">'+(due?'Please pay at the center':'All paid 👍')+'</div></div>'
   +'<div class="card tap" onclick="show(\'marks\')"><div class="lab">Latest mark</div>'+(m?'<div class="big">'+(m.absent?'AB':m.marks+'/'+m.max)+'</div><div class="lab">'+esc(m.exam)+' · '+esc(m.subject)+'</div>':'<div class="lab" style="margin-top:6px">No marks yet</div>')+'</div></div>'
   +'<div class="card tap" onclick="show(\'tests\')"><div class="ct">✅ Tests<span>'+myTests().length+' available ›</span></div><div class="lab">Tap to open your tests</div></div>'
   +'<div class="card"><div class="ct">📢 Notices</div>'+(ns.length?ns.map(function(n,i){return '<div class="row tap" onclick="noticeInfo('+i+')"><div class="m"><div class="t">'+esc(n.title)+'</div><div class="d">'+esc(n.text||'')+'</div><div class="d" style="color:var(--tx3);margin-top:2px">'+esc(n.date||'')+'</div></div></div>'}).join(''):'<div class="empty">No notices</div>')+'</div>';
}
function vAtt(){
  var first=new Date(calY,calM,1),dim=new Date(calY,calM+1,0).getDate(),off=first.getDay(),names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],h='',c={P:0,A:0,L:0},td=iso(new Date());
  ['S','M','T','W','T','F','S'].forEach(function(x){h+='<b>'+x+'</b>'});for(var i=0;i<off;i++)h+='<div style="background:none"></div>';
  for(var d=1;d<=dim;d++){var k=calY+'-'+String(calM+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),v=(ME.att||{})[k]||'';if(c[v]!==undefined)c[v]++;h+='<div class="'+v+(k===td?' today':'')+'" onclick="dayInfo(\''+k+'\')" style="cursor:pointer">'+d+'</div>'}
  return '<div class="card"><div class="msel"><button onclick="calGo(-1)">‹</button><b>'+names[calM]+' '+calY+'</b><button onclick="calGo(1)">›</button></div><div class="cal">'+h+'</div>'
   +'<div class="legend"><span>🟩 Present '+c.P+'</span><span>🟥 Absent '+c.A+'</span><span>🟨 Late '+c.L+'</span><span>🟦 Holiday</span></div></div>';
}
function calGo(n){$('main').classList.add('noanim');calM+=n;if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}$('main').innerHTML=vAtt()}
function vFees(){
  var f=ME.fees||[],due=f.reduce(function(t,x){return t+(x.balance||0)},0);
  return '<div class="card"><div class="lab">Total pending</div><div class="big" style="color:'+(due?'var(--bad)':'var(--ok)')+'">₹'+due.toLocaleString('en-IN')+'</div></div><div class="card"><div class="ct">Fee history</div>'
   +(f.length?f.map(function(x,i){return '<div class="row tap" onclick="feeInfo('+i+')"><div class="m"><div class="t">'+esc(x.month)+'</div><div class="d">Paid ₹'+(x.paid||0).toLocaleString('en-IN')+' of ₹'+(x.total||0).toLocaleString('en-IN')+'</div></div><span class="chip '+esc(x.status)+'">'+(x.status==='paid'?'Paid':x.status==='partial'?'Partial':x.status==='overdue'?'Overdue':'Pending')+'</span></div>'}).join(''):'<div class="empty">No fee records</div>')+'</div>';
}
function vMarks(){
  var m=(ME.marks||[]).slice().sort(function(a,b){return String(a.date).localeCompare(String(b.date))}),v=m.filter(function(x){return !x.absent&&x.max>0}),avg=v.length?v.reduce(function(t,x){return t+x.marks/x.max*100},0)/v.length:null;
  var bars=v.slice(-8).map(function(x){var p=x.marks/x.max*100;return '<div><span>'+Math.round(p)+'</span><i data-h="'+p+'" style="height:0"></i><span>'+esc(String(x.subject).slice(0,4))+'</span></div>'}).join('');
  return (avg!==null?'<div class="card"><div class="ct">Performance<span>average '+Math.round(avg)+'%</span></div><div class="bars">'+bars+'</div></div>':'')
   +'<div class="card"><div class="ct">All exams</div>'+(m.length?m.slice().reverse().map(function(x,i){var p=x.max?Math.round(x.marks/x.max*100):0;window.__mk=m.slice().reverse();return '<div class="row tap" onclick="markInfo('+i+')"><div class="m"><div class="t">'+esc(x.exam)+'</div><div class="d">'+esc(x.subject)+' · '+esc(x.date||'')+'</div></div><div style="text-align:right"><div class="t">'+(x.absent?'AB':x.marks+'/'+x.max)+'</div>'+(x.absent?'':'<div class="d" style="color:'+col(p)+'">'+p+'%</div>')+'</div></div>'}).join(''):'<div class="empty">No marks yet</div>')+'</div>';
}
function vPapers(){
  var p=(CEN.papers||[]).filter(function(x){return !x.grade||x.grade===ME.grade});
  return '<div class="card"><div class="ct">Question papers<span>for Class '+esc(ME.grade)+'</span></div>'+(p.length?p.map(function(x,i){return '<div class="row"><div class="m"><div class="t">'+esc(x.title)+'</div><div class="d">'+esc(x.subject||'')+(x.duration?' · '+x.duration+' min':'')+'</div></div><div style="display:flex;gap:6px">'+(x.link?'<a class="btn s" style="text-decoration:none;display:inline-block" href="'+esc(x.link)+'" target="_blank" rel="noopener" onclick="logAct(\'paper_open\',{paper:\''+esc(x.id)+'\'})">Open</a>':'')+(x.duration?'<button class="btn s" onclick="beginPaper('+i+')">▶ Start</button>':'')+'</div></div>'}).join(''):'<div class="empty">No papers yet</div>')+'</div>'
   +'<div class="note">Tap ▶ Start when you begin writing. Your tutor can see your start and finish time.</div>';
}

/* ── paper timer ── */
var TM=null;
function beginPaper(i){
  var p=(CEN.papers||[]).filter(function(x){return !x.grade||x.grade===ME.grade})[i];if(!p||!p.duration)return;
  if(!confirm('Start "'+p.title+'" now? Timer: '+p.duration+' minutes.'))return;
  var o={id:p.id,title:p.title,end:Date.now()+p.duration*60000,start:Date.now(),dur:p.duration};
  try{localStorage.setItem('kt_timer',JSON.stringify(o))}catch(e){}
  logAct('paper_start',{paper:p.id,title:p.title,duration:p.duration});startTimer(o);
}
function startTimer(o,resumed){
  TM=o;$('timer').classList.remove('hide');$('t-title').textContent=o.title;
  var e=new Date(o.end);$('t-end').textContent='Ends at '+String(e.getHours()%12||12).padStart(2,'0')+':'+String(e.getMinutes()).padStart(2,'0')+(e.getHours()>=12?' PM':' AM');
  clearInterval(window.__ti);window.__ti=setInterval(tick,1000);tick();
}
function tick(){
  if(!TM)return;var l=Math.max(0,TM.end-Date.now()),s=Math.ceil(l/1000),m=Math.floor(s/60),h=Math.floor(m/60),el=$('tleft');
  el.textContent=(h?h+':'+String(m%60).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s%60).padStart(2,'0');
  el.className=l<=300000?'crit':(l<=600000?'warn':'');
  if(l<=0){clearInterval(window.__ti);el.textContent="Time's up!";try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
}
function finishPaper(){
  if(!TM)return;logAct('paper_finish',{paper:TM.id,title:TM.title,startedAt:TM.start,minutesUsed:Math.round((Date.now()-TM.start)/60000)});
  clearInterval(window.__ti);TM=null;try{localStorage.removeItem('kt_timer')}catch(e){}$('timer').classList.add('hide');
}


/* ── tap details ── */
function popup(t,h){var o=$('pop');if(o)o.remove();o=document.createElement('div');o.id='pop';o.onclick=function(e){if(e.target===o)o.remove()};o.innerHTML='<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-size:15px">'+t+'</b><button class="btn s" onclick="$(\'pop\').remove()">✕</button></div>'+h+'</div>';document.body.appendChild(o)}
function noticeInfo(i){var n=(window.__ns||[])[i];if(n)popup(esc(n.title),'<div style="white-space:pre-wrap;font-size:13px">'+esc(n.text||'')+'</div><div class="d" style="margin-top:8px">'+esc(n.date||'')+'</div>')}
function feeInfo(i){var x=(ME.fees||[])[i];if(x)popup(esc(x.month),'<div class="row"><div class="m">Total fee</div><b>₹'+(x.total||0).toLocaleString('en-IN')+'</b></div><div class="row"><div class="m">Paid</div><b style="color:var(--ok)">₹'+(x.paid||0).toLocaleString('en-IN')+'</b></div><div class="row"><div class="m">Balance</div><b style="color:'+(x.balance?'var(--bad)':'var(--ok)')+'">₹'+(x.balance||0).toLocaleString('en-IN')+'</b></div><div class="row"><div class="m">Status</div><span class="chip '+esc(x.status)+'">'+esc(x.status)+'</span></div>')}
function markInfo(i){var x=(window.__mk||[])[i];if(!x)return;var p=x.max?Math.round(x.marks/x.max*100):0;popup(esc(x.exam),'<div class="row"><div class="m">Subject</div><b>'+esc(x.subject)+'</b></div><div class="row"><div class="m">Date</div><b>'+esc(x.date||'')+'</b></div><div class="row"><div class="m">Marks</div><b>'+(x.absent?'Absent':x.marks+' / '+x.max)+'</b></div>'+(x.absent?'':'<div class="row"><div class="m">Percentage</div><b style="color:'+col(p)+'">'+p+'%</b></div>'))}
function dayInfo(k){var v=(ME.att||{})[k],t={P:'🟩 Present',A:'🟥 Absent',L:'🟨 Late',H:'🟦 Holiday'}[v]||'No record';popup(esc(k),'<div style="font-size:16px">'+t+'</div>')}
/* ── MCQ tests ── */
var TS=null; // active test {t,start,end,ans:{},i}
function myTests(){return (CEN.tests||[]).filter(function(t){return t.published!==false&&(!t.grade||t.grade===ME.grade)})}
function resFor(id){return (ME.results||[]).filter(function(r){return r.testId===id})[0]}
function attLocal(){try{return JSON.parse(localStorage.getItem('kt_att_'+san(ME.id))||'{}')}catch(e){return {}}}
function vTests(){
  var T=myTests(),now=Date.now(),done=attLocal();
  return '<div class="card"><div class="ct">MCQ tests<span>Class '+esc(ME.grade)+'</span></div>'+(T.length?T.map(function(t){
    var r=resFor(t.id),sub=done[t.id]||r,st=t.start?new Date(t.start).getTime():0,en=t.end?new Date(t.end).getTime():0,st2='';
    var btn='';
    if(r)st2='<b style="color:var(--ok)">'+r.score+' / '+r.total+'</b>'+(r.rank1?'<div style="color:var(--ok);font-size:12px">🏆 Congratulations! You secured Rank 1.</div>':(r.topShared?'<div style="color:var(--ok);font-size:12px">🏆 You scored the highest marks in the class (shared).</div>':''));
    else if(sub)st2='Submitted ✓ — result after your tutor publishes';
    else if(st&&now<st){st2='Opens '+new Date(st).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}
    else if(en&&now>en){st2='Closed'}
    else btn='<button class="btn s" onclick="beginTest(\''+esc(t.id)+'\')">▶ Start</button>';
    return '<div class="row"><div class="m"><div class="t">'+esc(t.title)+'</div><div class="d">'+esc(t.subject||'')+' · '+t.qs.length+' Qs · '+t.duration+' min</div><div class="d">'+st2+'</div></div>'+btn+'</div>'}).join(''):'<div class="empty">No tests yet</div>')+'</div>';
}
async function beginTest(id){
  var t=myTests().filter(function(x){return x.id===id})[0];if(!t||TS)return;
  if(!confirm('Start "'+t.title+'"? You get '+t.duration+' minutes and can submit only once.'))return;
  var key=san(ME.id)+'__'+id,start=Date.now();
  if(!DEMO){
    try{var ex=await db.collection('attemptStarts').doc(key).get();if(ex.exists){alert('You already started this test.');return}
      await db.collection('attemptStarts').doc(key).set({sid:san(ME.id),testId:id,at:firebase.firestore.FieldValue.serverTimestamp(),dur:t.duration})}
    catch(e){alert('Could not start. Check internet.');return}
  }
  TS={t:t,start:start,end:start+t.duration*60000,ans:{},i:0,key:key};saveTS();openTest();logAct('test_start',{testId:id,title:t.title});
}
function saveTS(){try{localStorage.setItem('kt_test',JSON.stringify(TS))}catch(e){}}
function openTest(){
  var o=$('testov');if(!o){o=document.createElement('div');o.id='testov';o.style.cssText='position:fixed;inset:0;z-index:50;background:var(--bg,#0f172a);color:inherit;overflow-y:auto;padding:14px 14px 90px';document.body.appendChild(o)}
  clearInterval(window.__tt);window.__tt=setInterval(tTick,1000);renderTest();tTick();
}
function renderTest(){
  var t=TS.t,q=t.qs[TS.i],a=TS.ans[TS.i];
  $('testov').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>'+esc(t.title)+'</b><b id="ttime" style="font-variant-numeric:tabular-nums">--:--</b></div>'
   +'<div class="card"><div class="d">Question '+(TS.i+1)+' of '+t.qs.length+' · '+q.m+' mark'+(q.m>1?'s':'')+'</div><div class="t" style="margin:8px 0 12px;white-space:pre-wrap">'+esc(q.q)+'</div>'
   +q.o.map(function(o,j){return '<button class="btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;'+(a===j?'outline:2px solid var(--ok)':'')+'" onclick="pickAns('+j+')">'+'ABCD'[j]+') '+esc(o)+'</button>'}).join('')+'</div>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">'+t.qs.map(function(_,k){return '<button class="btn s" style="min-width:34px;'+(k===TS.i?'outline:2px solid #3b82f6;':'')+(TS.ans[k]!=null?'background:var(--ok);color:#fff':'')+'" onclick="goQ('+k+')">'+(k+1)+'</button>'}).join('')+'</div>'
   +'<div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="goQ(TS.i-1)">◀ Prev</button><button class="btn" style="flex:1" onclick="goQ(TS.i+1)">Next ▶</button></div>'
   +'<button class="btn" style="width:100%;margin-top:12px;background:#16a34a;color:#fff" onclick="submitTest()">Submit test</button>';
}
function pickAns(j){TS.ans[TS.i]=j;saveTS();renderTest()}
function goQ(k){if(k<0||k>=TS.t.qs.length)return;TS.i=k;saveTS();renderTest()}
function tTick(){
  if(!TS)return;var l=TS.end-Date.now(),e=$('ttime');
  if(l<=0){clearInterval(window.__tt);submitTest(true);return}
  var s=Math.ceil(l/1000);if(e){e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');e.style.color=l<=120000?'#ef4444':''}
}
async function submitTest(auto){
  if(!TS)return;var un=TS.t.qs.filter(function(_,k){return TS.ans[k]==null}).length;
  if(!auto&&!confirm(un?un+' question(s) unanswered. Submit now?':'Submit your answers?'))return;
  var rec={sid:san(ME.id),name:ME.name,testId:TS.t.id,ans:TS.t.qs.map(function(_,k){return TS.ans[k]==null?-1:TS.ans[k]}),clientStart:TS.start,clientEnd:Date.now()};
  try{
    if(DEMO){}else{rec.at=firebase.firestore.FieldValue.serverTimestamp();await db.collection('attempts').doc(TS.key).set(rec)}
    var d=attLocal();d[TS.t.id]=1;localStorage.setItem('kt_att_'+san(ME.id),JSON.stringify(d));
  }catch(e){alert('Submit failed — check internet and press Submit again before time ends.');if(!auto)return;TS.end=Date.now()+60000;return}
  clearInterval(window.__tt);var tt=TS.t;TS=null;try{localStorage.removeItem('kt_test')}catch(e){}
  $('testov').remove();logAct('test_submit',{testId:tt.id,title:tt.title});alert('Submitted ✓');show('tests');
}

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('student-sw.js').catch(function(){});
init();
</script>
